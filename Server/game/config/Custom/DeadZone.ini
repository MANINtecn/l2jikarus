# ---------------------------------------------------------------------------
# ZONA MORTAL (Dead Zone) - mod custom L2 Ikarus
# Area de risco extremo. Morreu la dentro, perde TUDO.
# Documentacao: data/scripts/custom/DeadZone/ZONA_MORTAL_DESIGN.md
# ---------------------------------------------------------------------------

# Liga/desliga o mod inteiro
DeadZoneEnabled = True

# ===================== BOSSES DA ZONA (mini-bosses solaveis) =====================
# Fator de HP dos raid bosses (0.08 = 8% do original). Escala por nivel naturalmente.
# Resultado: ~18k HP (lvl20) ate ~38k (lvl34). Ajuste se ficar facil/dificil demais.
DeadZoneBossHpFactor = 0.032
# Fator de dano dos bosses (0.6 = 60%). Dificil mas nao mata instantaneo.
DeadZoneBossDamageFactor = 0.6
# Fator de DEFESA dos bosses (0.3 = 30%). Reduz pra skills do jogador causarem dano.
DeadZoneBossDefenceFactor = 0.3

# --- DROPS dos bosses ---
# Adena por boss: valor aleatorio entre min e max
DeadZoneBossAdenaMin = 40000
DeadZoneBossAdenaMax = 120000
# L-Coin (91663) por boss: valor aleatorio entre min e max
DeadZoneBossLCoinMin = 5
DeadZoneBossLCoinMax = 15
# Item EXCLUSIVO: Sapphire Lv.1 (102817, Sealed) - joia equipavel direto
DeadZoneBossJewelBoxId = 102817
# Chance (%) do boss dropar a Sapphire
DeadZoneBossJewelChance = 3
# Materiais de craft (lixo) que vao pro Random Craft - ids separados por virgula
DeadZoneBossCraftMaterials = 92908,92910,92911,92913,92914
# Quantos materiais (aleatorios da lista) dropam por boss
DeadZoneBossCraftDropCount = 2

# ===================== ZONA D (Dion) =====================
# Id da zona no DeadZone.xml
DeadZoneD_ZoneId = 90001
DeadZoneD_Name = Zona Mortal de Dion
# Grade-teto permitida (D, C, B, A) - SEMPRE verificada (equaliza o poder)
DeadZoneD_MaxGrade = D
# Verificar nivel? False = qualquer nivel entra (conteudo p/ todos via drops)
DeadZoneCheckLevel = False
# Faixa de nivel (so usada se DeadZoneCheckLevel = True)
DeadZoneD_MinLevel = 20
DeadZoneD_MaxLevel = 40

# ===================== GATEKEEPER (NPC de acesso) =====================
# Npc do Gatekeeper (Portador da Morte) - 18424 Hermit (modelo retail garantido)
DeadZoneGatekeeperNpcId = 18424
# Onde o Gatekeeper fica (Giran)
DeadZoneGatekeeperX = 82172
DeadZoneGatekeeperY = 148666
DeadZoneGatekeeperZ = -3489
DeadZoneGatekeeperHeading = 0
# Ponto de ENTRADA dentro da zona (centro do poligono)
DeadZoneEntranceX = -46768
DeadZoneEntranceY = 54706
DeadZoneEntranceZ = -2400

# ===================== CONTROLE DE ACESSO (anti-burla) =====================
# Ponto para onde o jogador barrado e teleportado (padrao: Dion Town)
DeadZoneExitX = 15670
DeadZoneExitY = 142983
DeadZoneExitZ = -2705
# Intervalo da verificacao continua de grade (segundos) - baixo de proposito, e' so pra pegar quem invade bugando parede/instancia
DeadZoneCheckInterval = 10
# Numero de violacoes ate o jail
DeadZoneMaxViolations = 3
# Tempo de jail na ultima violacao (minutos)
DeadZoneJailMinutes = 5
# Mensagens de penalidade (sempre explicam motivo + consequencia)
DeadZoneKickWarn1 = Seu equipamento excede a grade desta zona! Voce foi removido. Violacao 1/3. Na 3a voce sera preso.
DeadZoneKickWarn2 = Equipamento acima da grade! Removido novamente. Violacao 2/3 - ULTIMA CHANCE antes da prisao.
DeadZoneJailMsg = Voce burlou a regra da Zona Mortal pela 3a vez e foi preso por 5 minutos.

# ===================== MORTE / CORPO / SAQUE =====================
# Npc usado como "corpo" (lapide). 18727 = Seal Tombstone (Folk, nao-atacavel)
DeadZoneGraveNpcId = 18727
# Duracao do corpo no chao (segundos) antes de expirar
DeadZoneCorpseDuration = 300
# Delay de saque por item (segundos)
DeadZoneLootDelay = 2
# Saque cancela se o saqueador apanhar ou se mover durante o delay
DeadZoneLootInterruptible = True
# Esconder nomes dos itens no tumulo (true = misterio "???", false = mostra o nome)
DeadZoneHideItemNames = True
# Quando o corpo expira com itens: DROP (cai no chao) ou DESTROY (perde pra sempre)
DeadZoneLootOnExpire = DESTROY
# Dropar adena tambem
DeadZoneDropAdena = True
# Itens que NUNCA dropam (quest items, moedas de evento) - IDs separados por virgula
DeadZoneProtectedItems = 57000

# --- Quebra de itens equipados na morte ---
# Liga/desliga a mecanica de quebra
DeadZoneBreakEnabled = True
# Faixa aleatoria de % dos itens EQUIPADOS que quebram (sorteado a cada morte)
DeadZoneBreakMinPercent = 40
DeadZoneBreakMaxPercent = 70
# Id do item "Destrocos" que o item quebrado vira
# 92911 = Material: Leather Scraps (Sealed) - da Craft Points +3000 (Random Craft)
DeadZoneDebrisItemId = 92911

# ===================== AVISOS =====================
# Mensagem na tela ao entrar (apos a 1a vez que ja viu a janela)
DeadZoneScreenMessage = ATENCAO! Voce entrou na ZONA MORTAL. Se morrer aqui, perde TUDO!

# Alerta GLOBAL (announce normal, servidor inteiro - atracao)
# Intervalo em minutos (0 = desliga)
DeadZoneAnnounceInterval = 30
DeadZoneAnnounceText = A ZONA MORTAL esta ativa! Drops valiosos aguardam os corajosos - mas quem morrer la perde TUDO.

# Alerta INTERNO (critical announce, so quem esta dentro - perigo)
# Intervalo em segundos (0 = desliga)
DeadZoneCriticalInterval = 30
DeadZoneCriticalText = PERIGO! Voce esta na ZONA MORTAL. Um descuido e voce perde TUDO.
